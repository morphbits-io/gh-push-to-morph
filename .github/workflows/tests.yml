name: Run automated tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - support/**
    types: [opened, synchronize]
    paths-ignore:
      - '**/*.md'
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  run_system_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout gh-push-to-morph
        uses: actions/checkout@v4

      - name: Run gh-push-allure-report-to-morph
        id: gh_push_allure_report_to_morph
        uses: ./
        with:
          MORPH_TOKEN: 'Y5TJwXwvHBRmP11AmNZtBRdR5ka1fbTrC2nNUmn4QGP0EDXzrGYdT2rfwmJf9EPryFfPuXmarWpLG1M5yopx2Lja_ac98624f553405e7ddb8c2d4c546bf72158149d85471703eb99c2dceae971bc6'
          ALLURE_REPORT_BUCKET_NAME: 'gh-push-to-morph-test'
          ALLURE_RESULTS_DIR: './tests/allure-report'
          LIFETIME: ${{ vars.LIFETIME }}

      - name: Prepare venv
        shell: bash
        id: prepare_venv
        run: |
          python3 -m venv venv
          source venv/bin/activate && pip install -r requirements.txt
        working-directory: ./tests

      - name: Run tests
        env:
          ALLURE_REPORT_URL: ${{ steps.gh_push_allure_report_to_morph.outputs.ALLURE_REPORT_URL }}
          REPORT_DIR: '../morph-allure-generated-report'
        run: |
          source venv/bin/activate && pytest test_downloads.py --url="$ALLURE_REPORT_URL" --report_dir="$REPORT_DIR"
        working-directory: ./tests
